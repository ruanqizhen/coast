      <stop offset="0%" stop-color="#2E86AB"></stop>
      <stop offset="100%" stop-color="#44BBA4"></stop>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"></rect>

